<!doctype html>
<html lang="en">
  <head>

  <body style="background-color: #212121; color: #fff">
    <div class="parent">
      <div class="day">Mumbai</div>
      <div class="day">Delhi</div>
      <div class="day">Kolkata</div>
      <div class="day">Pune</div>
      <div class="day">Indore</div>
    </div>

    <ul class="language">
      <li>New York</li>
    </ul>
  </body>
  <script>
    const parent = document.querySelector(".parent");
    // console.log(parent);
    // console.log(parent.children[2].innerHTML);

    for (let i = 0; i < parent.children.length; i++) {
      //   console.log(parent.children[i].innerHTML);
    }

    parent.children[1].style.color = "red";
    // console.log(parent.firstElementChild);
    // console.log(parent.LastElementChild);

    const dayOne = document.querySelector(".day");
    // console.log(dayOne);
    // console.log(dayOne.parentElement);
    // console.log(dayOne.nextElementSibling);

    // console.log("NODES:", parent.childNodes);

    function addCity(cityName) {
      const cityList = document.createElement("li");
      cityList.innerHTML = `${cityName}`;

      document.querySelector(".language").appendChild(cityList);
    }

    addCity("London");
    addCity("Tokyo");

    function addOptiCity(cityName) {
      const cityList = document.createElement("li");
      cityList.appendChild(document.createTextNode(cityName));
      document.querySelector(".language").appendChild(cityList);
    }

    addOptiCity("Japan");

    const changeCityName = document.querySelector("li:nth-child(1)");

    const newCityName = document.createElement('li')
    newCityName.textContent = "Paris";

    changeCityName.parentNode.replaceChild(newCityName, changeCityName);
    // changeCityName.replaceWith(newCityName);

  </script>
